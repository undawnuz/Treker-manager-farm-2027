    color: var(--text);
    min-height: 100vh;
    padding: 12px;
    max-width: 1400px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    color: #69f0ae;
    font-size: 1.55rem;
    margin: 8px 0 16px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7), 0 0 20px rgba(105, 240, 174, 0.3);
  }

  .global-summary {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .global-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 10px;
  }
  .stat {
    background: rgba(30, 20, 45, 0.85);
    padding: 12px 8px;
    border-radius: 10px;
    text-align: center;
  }
  .stat .l { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
  .stat .v { font-size: 1.25rem; font-weight: 700; color: var(--accent2); }

  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 10px;
    margin-bottom: 14px;
  }
  .tab {
    flex-shrink: 0;
    padding: 12px 22px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    font-size: 1rem;
  }
  .tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(156, 39, 176, 0.5);
  }
  .tab-add { background: rgba(60, 30, 90, 0.9); color: #69f0ae; }
  .tab-special { background: rgba(60, 30, 90, 0.9); color: #1e4d9c; border-color: #a8c4e0; }

  .panel { display: none; }
  .panel.active { display: block; }

  .country-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .country-header h2 { color: var(--accent2); font-size: 1.25rem; }

  .farm-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 230, 118, 0.08);
    padding: 14px;
    margin-bottom: 14px;
  }
  .farm-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .farm-card-header input {
    font-size: 1.05rem;
    font-weight: 600;
    max-width: 260px;
  }
  .farm-actions { display: flex; gap: 6px; }

  .fields-title {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .field-row {
    display: grid;
    grid-template-columns: 1.1fr 0.7fr 0.55fr 0.55fr 0.55fr 0.55fr 0.55fr 0.55fr 0.55fr 0.55fr 0.55fr 32px;
    gap: 6px;
    margin-bottom: 8px;
    align-items: end;
    font-size: 0.85rem;
  }
  @media (max-width: 1100px) {
    .field-row {
      grid-template-columns: 1fr 1fr 1fr;
    }
  }

  label {
    font-size: 0.68rem;
    color: var(--muted);
    display: block;
    margin-bottom: 2px;
  }
  input, select {
    width: 100%;
    padding: 7px 8px;
    background: rgba(30, 20, 45, 0.85);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.9rem;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 9px 14px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.88rem;
  }
  .btn-secondary { background: #4a2d6a; color: #69f0ae; }
  .btn-danger { background: #c62828; color: white; padding: 7px 10px; font-size: 0.8rem; }
  .btn-sm { padding: 5px 8px; font-size: 0.75rem; }

  .farm-totals {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 0.85rem;
  }
  .farm-totals span { color: var(--muted); }
  .farm-totals strong { color: var(--accent2); }

  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }

  .country-totals {
    background: var(--card2);
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 8px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    font-size: 0.9rem;
  }
  .country-totals strong { color: var(--accent2); }

  .total-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 230, 118, 0.08);
    padding: 16px;
    margin-bottom: 16px;
  }
  .total-section h3 {
    color: var(--accent2);
    margin-bottom: 12px;
    font-size: 1.1rem;
  }
  .crop-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  .crop-table th, .crop-table td {
    border: 1px solid var(--border);
    padding: 8px 10px;
    text-align: left;
  }
  .crop-table th {
    background: #7b1fa2; color: #fff;
    color: var(--accent2);
  }
  .crop-table tr:nth-child(even) { background: rgba(40, 25, 60, 0.7); }

  .goat-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 230, 118, 0.08);
    padding: 16px;
    margin-bottom: 16px;
  }
  .goat-box h3 {
    color: var(--accent2);
    margin-bottom: 12px;
  }
  .goat-form {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 10px;
    margin-bottom: 16px;
    align-items: end;
  }
  @media (max-width: 600px) {
    .goat-form { grid-template-columns: 1fr; }
  }
  .goat-result {
    background: rgba(30, 20, 45, 0.85);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    font-size: 1.15rem;
    margin-bottom: 16px;
  }
  .goat-result strong {
    color: var(--accent2);
    font-size: 1.3rem;
  }

  .breed-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 230, 118, 0.08);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .breed-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    cursor: pointer;
    background: rgba(60, 30, 90, 0.9);
    user-select: none;
  }
  .breed-header:hover { background: rgba(75, 40, 110, 0.95); }
  .breed-header .name {
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--accent2);
  }
  .breed-header .meta {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .breed-header .arrow {
    font-size: 1.1rem;
    color: var(--muted);
    transition: transform 0.2s;
  }
  .breed-header.open .arrow { transform: rotate(90deg); }
  .breed-body {
    display: none;
    padding: 12px 14px;
    border-top: 1px solid var(--border);
  }
  .breed-body.open { display: block; }
  .cross-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid rgba(100, 60, 140, 0.4);
  }
  .cross-row:last-child { border-bottom: none; }
  .cross-row .result {
    color: var(--accent2);
    font-weight: 600;
  }

  .add-cross {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 10px;
    align-items: end;
  }
  @media (max-width: 700px) {
    .add-cross { grid-template-columns: 1fr; }
  }

  .notes-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .notes-box h3 {
    color: var(--accent2);
    margin-bottom: 10px;
  }
  .notes-box textarea {
    width: 100%;
    min-height: 160px;
    padding: 12px;
    background: rgba(30, 20, 45, 0.85);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 1rem;
    line-height: 1.5;
    resize: vertical;
    font-family: inherit;
  }
  .notes-box textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  .cap-ok { color: var(--accent2); font-weight: 700; }
  .cap-over { color: #ff5252; font-weight: 700; }
  .equip-totals {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    font-size: 0.82rem;
    margin-top: 6px;
  }
  .equip-totals span { color: var(--muted); }
  .equip-totals strong { color: var(--accent2); }

</style>
</head>
<body>

<h1>🚜 Farm Manager 2027</h1>

<div class="global-summary">
  <div class="global-grid" id="globalSummary"></div>
</div>

<div class="tabs" id="tabs"></div>
<div id="panels"></div>

<script>
const STORAGE_KEY = "fm2027_v6";
const NOTES_KEY = "fm2027_notes_v1";
const BARN_LIMIT = 50;
const GOAT_KEY = "fm2027_goats_v2";

const emptyField = () => ({
  crop: "", ha: 0,
  tractors: 0, bulldozer: 0, combine: 0,
  plow: 0, fert: 0, seed: 0, irrig: 0, clear: 0, feed: 0
});

let data = JSON.parse(localStorage.getItem(STORAGE_KEY));
if (!data) {
  data = [
    {
      id: 1,
      name: "Uzbekistan",
      farms: [
        {
          id: 101,
          name: "emmas hoes",
          fields: [
            { crop: "wheat", ha: 150, tractors: 0, bulldozer: 0, combine: 0, plow: 0, fert: 0, seed: 0, irrig: 0, clear: 0, feed: 0 },
            { crop: "Quy", ha: 150, tractors: 0, bulldozer: 0, combine: 0, plow: 0, fert: 0, seed: 0, irrig: 0, clear: 0, feed: 0 },
            { crop: "Echki", ha: 149.76, tractors: 0, bulldozer: 0, combine: 0, plow: 0, fert: 0, seed: 0, irrig: 0, clear: 0, feed: 0 }
          ]
        }
      ]
    },
    {
      id: 2,
      name: "Uganda",
      farms: [
        { id: 201, name: "Farm 1", fields: [{ ...emptyField(), crop: "wheat", ha: 150 }] },
        { id: 202, name: "Farm 2", fields: [{ ...emptyField(), crop: "Quy", ha: 150 }] },
        { id: 203, name: "Farm 3", fields: [{ ...emptyField(), crop: "Echki", ha: 150 }] },
        { id: 204, name: "Farm 4", fields: [{ ...emptyField(), ha: 150 }] }
      ]
    }
  ];
}

// Миграция старых полей
data.forEach(c => c.farms.forEach(f => f.fields.forEach(fl => {
  ["bulldozer","combine","plow","fert","seed","irrig","clear","feed"].forEach(k => {
    if (fl[k] === undefined) fl[k] = 0;
  });
})));

let goatBreeds = JSON.parse(localStorage.getItem(GOAT_KEY)) || [
  {
    name: "Alpine",
    crosses: [
      { with: "kiko", result: "alpine kiko" },
      { with: "nubian", result: "alpinenubian" },
      { with: "pygmy", result: "lastefcairnsbreed" },
      { with: "nigeriandraft", result: "kozalina" },
      { with: "saanin", result: "paggeo mountaint" },
      { with: "lamancha", result: "allama americzech" },
      { with: "oberhasli", result: "aqsa" },
      { with: "boer", result: "Falastin" },
      { with: "toggenburg", result: "jojo dreux ASC" }
    ]
  },
  {
    name: "nubian",
    crosses: [
      { with: "kiko", result: "ozercop Ankara teke" },
      { with: "pygmy", result: "nubiapyg botti" },
      { with: "nigeriandraft", result: "geriubi mount" }
    ]
  }
];

let activeTab = "total";
let openBreeds = {};

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function saveGoats() {
  localStorage.setItem(GOAT_KEY, JSON.stringify(goatBreeds));
}

function getAllBreedNames() {
  const set = new Set();
  goatBreeds.forEach(b => {
    set.add(b.name);
    b.crosses.forEach(c => {
      set.add(c.with);
      if (c.result) set.add(c.result);
    });
  });
  return Array.from(set).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
}

function sumField(fields, key) {
  return fields.reduce((s, x) => s + (x[key] || 0), 0);
}

function render() {
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";

  const totalTab = document.createElement("div");
  totalTab.className = "tab tab-special" + (activeTab === "total" ? " active" : "");
  totalTab.textContent = "Total";
  totalTab.onclick = () => { activeTab = "total"; render(); };
  tabsEl.appendChild(totalTab);

  const goatTab = document.createElement("div");
  goatTab.className = "tab tab-special" + (activeTab === "goat" ? " active" : "");
  goatTab.textContent = "GOAT";
  goatTab.onclick = () => { activeTab = "goat"; render(); };
  tabsEl.appendChild(goatTab);

  data.forEach(country => {
    const tab = document.createElement("div");
    tab.className = "tab" + (activeTab === country.id ? " active" : "");
    tab.textContent = country.name;
    tab.onclick = () => { activeTab = country.id; render(); };
    tabsEl.appendChild(tab);
  });

  const addTab = document.createElement("div");
  addTab.className = "tab tab-add";
  addTab.textContent = "+ Страна";
  addTab.onclick = addCountry;
  tabsEl.appendChild(addTab);

  const panelsEl = document.getElementById("panels");
  panelsEl.innerHTML = "";

  // ---- TOTAL ----
  if (activeTab === "total") {
    const panel = document.createElement("div");
    panel.className = "panel active";

    const cropCount = {};
    const cropHa = {};
    const eq = { tractors:0, bulldozer:0, combine:0, plow:0, fert:0, seed:0, irrig:0, clear:0, feed:0 };
    data.forEach(c => {
      c.farms.forEach(f => {
        f.fields.forEach(fl => {
          const crop = (fl.crop || "").trim();
          if (crop) {
            cropCount[crop] = (cropCount[crop] || 0) + 1;
            cropHa[crop] = (cropHa[crop] || 0) + (fl.ha || 0);
          }
          eq.tractors += fl.tractors || 0;
          eq.bulldozer += fl.bulldozer || 0;
          eq.combine += fl.combine || 0;
          eq.plow += fl.plow || 0;
          eq.fert += fl.fert || 0;
          eq.seed += fl.seed || 0;
          eq.irrig += fl.irrig || 0;
          eq.clear += fl.clear || 0;
          eq.feed += fl.feed || 0;
        });
      });
    });
    const notesText = localStorage.getItem(NOTES_KEY) || "";

    let cropRows = Object.keys(cropCount).sort().map(crop => `
      <tr>
        <td>${crop}</td>
        <td>${cropCount[crop]}</td>
        <td>${cropHa[crop].toFixed(2)}</td>
      </tr>
    `).join("") || `<tr><td colspan="3" style="text-align:center;color:var(--muted)">Нет культур</td></tr>`;

    let countryRows = data.map(c => {
      let ha = 0, tr = 0, fields = 0;
      c.farms.forEach(f => {
        fields += f.fields.length;
        f.fields.forEach(fl => {
          ha += fl.ha || 0;
          tr += fl.tractors || 0;
        });
      });
      return `
        <tr>
          <td>${c.name}</td>
          <td>${c.farms.length}</td>
          <td>${fields}</td>
          <td>${ha.toFixed(2)}</td>
          <td>${tr}</td>
        </tr>
      `;
    }).join("") || `<tr><td colspan="5" style="text-align:center;color:var(--muted)">Нет стран</td></tr>`;

    panel.innerHTML = `
      <div class="total-section">
        <h3>📊 Общий счёт по странам</h3>
        <table class="crop-table">
          <thead>
            <tr><th>Страна</th><th>Ферм</th><th>Полей</th><th>Гектаров</th><th>Тракторов</th></tr>
          </thead>
          <tbody>${countryRows}</tbody>
        </table>
      </div>
      <div class="total-section">
        <h3>🌾 Культуры (сколько полей и гектаров)</h3>
        <table class="crop-table">
          <thead>
            <tr><th>Культура</th><th>Кол-во полей</th><th>Всего гектаров</th></tr>
          </thead>
          <tbody>${cropRows}</tbody>
        </table>
      </div>

      <div class="total-section">
        <h3>🚜 Техника и работы (итого)</h3>
        <table class="crop-table">
          <thead>
            <tr><th>Тип</th><th>Количество</th></tr>
          </thead>
          <tbody>
            <tr><td>Трактор</td><td>${eq.tractors}</td></tr>
            <tr><td>Бульдозер</td><td>${eq.bulldozer}</td></tr>
            <tr><td>Комбайн</td><td>${eq.combine}</td></tr>
            <tr><td>Вспашка</td><td>${eq.plow}</td></tr>
            <tr><td>Удобрения</td><td>${eq.fert}</td></tr>
            <tr><td>Посев</td><td>${eq.seed}</td></tr>
            <tr><td>Орошение</td><td>${eq.irrig}</td></tr>
            <tr><td>Расчистка</td><td>${eq.clear}</td></tr>
            <tr><td>Кормление</td><td>${eq.feed}</td></tr>
          </tbody>
        </table>
      </div>

      <div class="notes-box">
        <h3>📝 Заметки / планы</h3>
        <textarea id="notesArea" placeholder="Пиши сюда планы, задачи, напоминания..."></textarea>
        <button class="btn" style="margin-top:10px;" onclick="saveNotes()">Сохранить заметки</button>
      </div>
    `;
    panelsEl.appendChild(panel);
    const na = document.getElementById("notesArea");
    if (na) na.value = notesText;
  }

  // ---- GOAT ----
  else if (activeTab === "goat") {
    const panel = document.createElement("div");
    panel.className = "panel active";

    const allNames = getAllBreedNames();
    const options = allNames.map(b => `<option value="${b}">${b}</option>`).join("");

    let breedsHtml = goatBreeds.map((breed, bIdx) => {
      const isOpen = openBreeds[breed.name];

      const crossesHtml = breed.crosses.map((c, cIdx) => `
        <div class="cross-row">
          <div>× <strong>${c.with}</strong></div>
          <div class="result">${c.result}</div>
          <button class="btn btn-danger btn-sm" onclick="removeCross(${bIdx}, ${cIdx})">×</button>
        </div>
      `).join("") || `<div style="color:var(--muted);padding:8px 0;">Нет скрещиваний</div>`;

      return `
        <div class="breed-card">
          <div class="breed-header ${isOpen ? 'open' : ''}" onclick="toggleBreed('${breed.name.replace(/'/g, "\\'")}')">
            <div>
              <div class="name">${breed.name}</div>
              <div class="meta">${breed.crosses.length} скрещиваний</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); removeBreed(${bIdx})">Удалить</button>
              <span class="arrow">▶</span>
            </div>
          </div>
          <div class="breed-body ${isOpen ? 'open' : ''}">
            ${crossesHtml}
            <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);">
              <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;">
                <div>
                  <label>Скрестить с</label>
                  <input type="text" id="addWith_${bIdx}" placeholder="kiko">
                </div>
                <div>
                  <label>Результат</label>
                  <input type="text" id="addRes_${bIdx}" placeholder="alpine kiko">
                </div>
                <button class="btn btn-sm" onclick="addCrossToBreed(${bIdx})">+</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join("") || `<div class="empty">Нет сортов</div>`;

    panel.innerHTML = `
      <div class="goat-box">
        <h3>🐐 Скрещивание коз</h3>
        <div class="goat-form">
          <div>
            <label>Сорт 1</label>
            <select id="goat1">${options}</select>
          </div>
          <div>
            <label>Сорт 2</label>
            <select id="goat2">${options}</select>
          </div>
          <button class="btn" onclick="calcGoat()">Скрестить</button>
        </div>
        <div class="goat-result" id="goatResult">
          Выбери два сорта и нажми «Скрестить»
        </div>
      </div>

      <div class="goat-box">
        <h3>➕ Добавить новое скрещивание / сорт</h3>
        <div class="add-cross">
          <div>
            <label>Сорт 1 (основной)</label>
            <input type="text" id="newBreed1" placeholder="Alpine">
          </div>
          <div>
            <label>Сорт 2</label>
            <input type="text" id="newBreed2" placeholder="kiko">
          </div>
          <div>
            <label>Результат</label>
            <input type="text" id="newResult" placeholder="alpine kiko">
          </div>
          <button class="btn" onclick="addNewCross()">Добавить</button>
        </div>
        <p style="font-size:0.8rem;color:var(--muted);margin-top:8px;">
          Если сорта 1 ещё нет — он создастся автоматически
        </p>
      </div>

      <div class="goat-box">
        <h3>📋 Сорта и их скрещивания</h3>
        ${breedsHtml}
      </div>
    `;
    panelsEl.appendChild(panel);
  }

  // ---- Страны ----
  else {
    data.forEach(country => {
      if (activeTab !== country.id) return;

      const panel = document.createElement("div");
      panel.className = "panel active";

      let countryHa = 0, countryTr = 0, countryFields = 0;
      country.farms.forEach(f => {
        f.fields.forEach(fl => {
          countryHa += fl.ha || 0;
          countryTr += fl.tractors || 0;
          countryFields++;
        });
      });

      let farmsHtml = country.farms.map(farm => {
        const farmHa = sumField(farm.fields, "ha");
        const farmTr = sumField(farm.fields, "tractors");
        const farmBul = sumField(farm.fields, "bulldozer");
        const farmCom = sumField(farm.fields, "combine");

        const fieldsHtml = farm.fields.map((field, idx) => `
          <div class="field-row">
            <div>
              <label>Культура</label>
              <input value="${field.crop || ""}" onchange="updateField(${country.id}, ${farm.id}, ${idx}, 'crop', this.value)">
            </div>
            <div>
              <label>Гектары</label>
              <input type="number" step="0.01" value="${field.ha || 0}" onchange="updateField(${country.id}, ${farm.id}, ${idx}, 'ha', +this.value)">
            </div>
            <div>
              <label>Трактор</label>
              <input type="number" value="${field.tractors || 0}" onchange="updateField(${country.id}, ${farm.id}, ${idx}, 'tractors', +this.value)">
            </div>
            <div>
              <label>Бульдозер</label>
              <input type="number" value="${field.bulldozer || 0}" onchange="updateField(${country.id}, ${farm.id}, ${idx}, 'bulldozer', +this.value)">
            </div>
            <div>
              <label>Комбайн</label>
              <input type="number" value="${field.combine || 0}" onchange="updateField(${country.id}, ${farm.id}, ${idx}, 'combine', +this.value)">
            </div>
            <div>
              <label>Вспашка</label>
              <input type="number" value="${field.plow || 0}" onchange="updateField(${country.id}, ${farm.id}, ${idx}, 'plow', +this.value)">
            </div>
            <div>
              <label>Удобрения</label>
              <input type="number" value="${field.fert || 0}" onchange="updateField(${country.id}, ${farm.id}, ${idx}, 'fert', +this.value)">
            </div>
            <div>
              <label>Посев</label>
              <input type="number" value="${field.seed || 0}" onchange="updateField(${country.id}, ${farm.id}, ${idx}, 'seed', +this.value)">
            </div>
            <div>
              <label>Орошение</label>
              <input type="number" value="${field.irrig || 0}" onchange="updateField(${country.id}, ${farm.id}, ${idx}, 'irrig', +this.value)">
            </div>
            <div>
              <label>Расчистка</label>
              <input type="number" value="${field.clear || 0}" onchange="updateField(${country.id}, ${farm.id}, ${idx}, 'clear', +this.value)">
            </div>
            <div>
              <label>Кормление</label>
              <input type="number" value="${field.feed || 0}" onchange="updateField(${country.id}, ${farm.id}, ${idx}, 'feed', +this.value)">
            </div>
            <div>
              <button class="btn btn-danger btn-sm" onclick="removeField(${country.id}, ${farm.id}, ${idx})">×</button>
            </div>
          </div>
        `).join("");

        return `
          <div class="farm-card">
            <div class="farm-card-header">
              <div>
                <input value="${farm.name}" onchange="updateFarmName(${country.id}, ${farm.id}, this.value)" placeholder="Название фермы">
                <div style="margin-top:4px;font-size:0.85rem;">
                  Амбар: <span class="${farmEquipSum(farm.fields) > BARN_LIMIT ? 'cap-over' : 'cap-ok'}">${farmEquipSum(farm.fields)} / ${BARN_LIMIT}</span>
                </div>
              </div>
              <div class="farm-actions">
                <button class="btn btn-secondary btn-sm" onclick="addField(${country.id}, ${farm.id})">+ Поле</button>
                <button class="btn btn-danger btn-sm" onclick="removeFarm(${country.id}, ${farm.id})">Удалить ферму</button>
              </div>
            </div>
            <div class="fields-title">Поля / культуры / техника / работы:</div>
            ${fieldsHtml || '<div style="color:var(--muted);font-size:0.9rem;padding:8px 0;">Нет полей</div>'}
            <div class="farm-totals">
              <div><span>Гектары:</span> <strong>${farmHa.toFixed(2)}</strong></div>
              <div><span>Тракторы:</span> <strong>${farmTr}</strong></div>
              <div><span>Бульдозеры:</span> <strong>${sumField(farm.fields, "bulldozer")}</strong></div>
              <div><span>Комбайны:</span> <strong>${sumField(farm.fields, "combine")}</strong></div>
              <div><span>Вспашка:</span> <strong>${sumField(farm.fields, "plow")}</strong></div>
              <div><span>Удобрения:</span> <strong>${sumField(farm.fields, "fert")}</strong></div>
              <div><span>Посев:</span> <strong>${sumField(farm.fields, "seed")}</strong></div>
              <div><span>Орошение:</span> <strong>${sumField(farm.fields, "irrig")}</strong></div>
              <div><span>Расчистка:</span> <strong>${sumField(farm.fields, "clear")}</strong></div>
              <div><span>Кормление:</span> <strong>${sumField(farm.fields, "feed")}</strong></div>
              <div><span>Полей:</span> <strong>${farm.fields.length}</strong></div>
            </div>
          </div>
        `;
      }).join("");

      panel.innerHTML = `
        <div class="country-header">
          <h2>
            <input value="${country.name}" onchange="updateCountryName(${country.id}, this.value)" 
                   style="font-size:1.2rem;font-weight:700;max-width:220px;background:transparent;border:1px solid transparent;color:var(--accent2);">
          </h2>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary" onclick="addFarm(${country.id})">+ Ферма</button>
            <button class="btn btn-danger" onclick="removeCountry(${country.id})">Удалить страну</button>
          </div>
        </div>
        ${farmsHtml || '<div class="empty">В этой стране пока нет ферм</div>'}
        <div class="country-totals">
          <div>Ферм: <strong>${country.farms.length}</strong></div>
          <div>Полей: <strong>${countryFields}</strong></div>
          <div>Гектаров: <strong>${countryHa.toFixed(2)}</strong></div>
          <div>Тракторов: <strong>${countryTr}</strong></div>
          <div>Бульдозеры: <strong>${country.farms.reduce((s,f)=>s+sumField(f.fields,"bulldozer"),0)}</strong></div>
          <div>Комбайны: <strong>${country.farms.reduce((s,f)=>s+sumField(f.fields,"combine"),0)}</strong></div>
          <div>Вспашка: <strong>${country.farms.reduce((s,f)=>s+sumField(f.fields,"plow"),0)}</strong></div>
          <div>Удобрения: <strong>${country.farms.reduce((s,f)=>s+sumField(f.fields,"fert"),0)}</strong></div>
          <div>Посев: <strong>${country.farms.reduce((s,f)=>s+sumField(f.fields,"seed"),0)}</strong></div>
          <div>Орошение: <strong>${country.farms.reduce((s,f)=>s+sumField(f.fields,"irrig"),0)}</strong></div>
          <div>Расчистка: <strong>${country.farms.reduce((s,f)=>s+sumField(f.fields,"clear"),0)}</strong></div>
          <div>Кормление: <strong>${country.farms.reduce((s,f)=>s+sumField(f.fields,"feed"),0)}</strong></div>
        </div>
      `;
      panelsEl.appendChild(panel);
    });
  }

  updateGlobal();
}

function farmEquipSum(fields) {
  let s = 0;
  fields.forEach(fl => {
    s += (fl.tractors||0) + (fl.bulldozer||0) + (fl.combine||0) + (fl.plow||0)
      + (fl.fert||0) + (fl.seed||0) + (fl.irrig||0) + (fl.clear||0) + (fl.feed||0);
  });
  return s;
}

function updateGlobal() {
  let totalHa = 0, totalTr = 0, totalFarms = 0, totalFields = 0;
  let tot = { bulldozer:0, combine:0, plow:0, fert:0, seed:0, irrig:0, clear:0, feed:0 };
  data.forEach(c => {
    totalFarms += c.farms.length;
    c.farms.forEach(f => {
      totalFields += f.fields.length;
      f.fields.forEach(fl => {
        totalHa += fl.ha || 0;
        totalTr += fl.tractors || 0;
        tot.bulldozer += fl.bulldozer || 0;
        tot.combine += fl.combine || 0;
        tot.plow += fl.plow || 0;
        tot.fert += fl.fert || 0;
        tot.seed += fl.seed || 0;
        tot.irrig += fl.irrig || 0;
        tot.clear += fl.clear || 0;
        tot.feed += fl.feed || 0;
      });
    });
  });

  document.getElementById("globalSummary").innerHTML = `
    <div class="stat"><div class="l">Всего гектаров</div><div class="v">${totalHa.toFixed(2)}</div></div>
    <div class="stat"><div class="l">Тракторы</div><div class="v">${totalTr}</div></div>
    <div class="stat"><div class="l">Бульдозеры</div><div class="v">${tot.bulldozer}</div></div>
    <div class="stat"><div class="l">Комбайны</div><div class="v">${tot.combine}</div></div>
    <div class="stat"><div class="l">Ферм</div><div class="v">${totalFarms}</div></div>
    <div class="stat"><div class="l">Полей</div><div class="v">${totalFields}</div></div>
    <div class="stat"><div class="l">Стран</div><div class="v">${data.length}</div></div>
  `;
}

function saveNotes() {
  const el = document.getElementById("notesArea");
  if (el) {
    localStorage.setItem(NOTES_KEY, el.value);
    alert("Заметки сохранены");
  }
}

function toggleBreed(name) {
  openBreeds[name] = !openBreeds[name];
  render();
}

function calcGoat() {
  const b1 = document.getElementById("goat1").value;
  const b2 = document.getElementById("goat2").value;
  const resultEl = document.getElementById("goatResult");

  if (b1 === b2) {
    resultEl.innerHTML = `Одинаковые сорта → <strong>${b1}</strong>`;
    return;
  }

  let found = null;
  for (const breed of goatBreeds) {
    if (breed.name.toLowerCase() === b1.toLowerCase()) {
      found = breed.crosses.find(c => c.with.toLowerCase() === b2.toLowerCase());
      if (found) break;
    }
    if (breed.name.toLowerCase() === b2.toLowerCase()) {
      found = breed.crosses.find(c => c.with.toLowerCase() === b1.toLowerCase());
      if (found) break;
    }
  }

  if (found) {
    resultEl.innerHTML = `${b1} × ${b2} = <strong>${found.result}</strong>`;
  } else {
    resultEl.innerHTML = `${b1} × ${b2} = <strong style="color:#ffab91">нет в таблице</strong><br>
      <span style="font-size:0.85rem;color:var(--muted)">Добавь через форму ниже</span>`;
  }
}

function addNewCross() {
  const b1 = document.getElementById("newBreed1").value.trim();
  const b2 = document.getElementById("newBreed2").value.trim();
  const res = document.getElementById("newResult").value.trim();
  if (!b1 || !b2 || !res) {
    alert("Заполни все три поля");
    return;
  }

  let breed = goatBreeds.find(b => b.name.toLowerCase() === b1.toLowerCase());
  if (!breed) {
    breed = { name: b1, crosses: [] };
    goatBreeds.push(breed);
  }
  breed.crosses.push({ with: b2, result: res });
  openBreeds[b1] = true;
  saveGoats();
  document.getElementById("newBreed1").value = "";
  document.getElementById("newBreed2").value = "";
  document.getElementById("newResult").value = "";
  render();
}

function addCrossToBreed(breedIdx) {
  const withEl = document.getElementById("addWith_" + breedIdx);
  const resEl = document.getElementById("addRes_" + breedIdx);
  const w = withEl.value.trim();
  const r = resEl.value.trim();
  if (!w || !r) {
    alert("Заполни оба поля");
    return;
  }
  goatBreeds[breedIdx].crosses.push({ with: w, result: r });
  saveGoats();
  render();
}

function removeCross(breedIdx, crossIdx) {
  if (!confirm("Удалить это скрещивание?")) return;
  goatBreeds[breedIdx].crosses.splice(crossIdx, 1);
  saveGoats();
  render();
}

function removeBreed(idx) {
  if (!confirm("Удалить весь сорт и все его скрещивания?")) return;
  goatBreeds.splice(idx, 1);
  saveGoats();
  render();
}

function updateCountryName(id, value) {
  const c = data.find(x => x.id === id);
  if (c) { c.name = value; save(); render(); }
}

function updateFarmName(countryId, farmId, value) {
  const c = data.find(x => x.id === countryId);
  if (!c) return;
  const f = c.farms.find(x => x.id === farmId);
  if (f) { f.name = value; save(); }
}

function updateField(countryId, farmId, idx, field, value) {
  const c = data.find(x => x.id === countryId);
  if (!c) return;
  const f = c.farms.find(x => x.id === farmId);
  if (f && f.fields[idx]) {
    f.fields[idx][field] = value;
    save();
    render();
  }
}

function addCountry() {
  const id = Date.now();
  data.push({ id, name: "Новая страна", farms: [] });
  activeTab = id;
  save();
  render();
}

function removeCountry(id) {
  if (!confirm("Удалить страну и все её фермы?")) return;
  data = data.filter(x => x.id !== id);
  if (activeTab === id) activeTab = "total";
  save();
  render();
}

function addFarm(countryId) {
  const c = data.find(x => x.id === countryId);
  if (!c) return;
  c.farms.push({
    id: Date.now(),
    name: "Новая ферма",
    fields: [emptyField()]
  });
  save();
  render();
}

function removeFarm(countryId, farmId) {
  if (!confirm("Удалить ферму?")) return;
  const c = data.find(x => x.id === countryId);
  if (!c) return;
  c.farms = c.farms.filter(x => x.id !== farmId);
  save();
  render();
}

function addField(countryId, farmId) {
  const c = data.find(x => x.id === countryId);
  if (!c) return;
  const f = c.farms.find(x => x.id === farmId);
  if (f) {
    f.fields.push(emptyField());
    save();
    render();
  }
}

function removeField(countryId, farmId, idx) {
  const c = data.find(x => x.id === countryId);
  if (!c) return;
  const f = c.farms.find(x => x.id === farmId);
  if (f) {
    f.fields.splice(idx, 1);
    save();
    render();
  }
}

render();
</script>
</body>
</html>
